name: Daily Koohnameh Podcast

on:
  schedule:
    - cron: '0 18 * * *'  # Every day at 18:00 UTC (21:30 Iran)
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Refresh NotebookLM auth
        env:
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: |
          # Write master token to profile dir
          mkdir -p ~/.notebooklm/profiles/default
          echo "$NOTEBOOKLM_MASTER_TOKEN" > ~/.notebooklm/profiles/default/master_token.json
          # Refresh cookies from master token
          python -m notebooklm login --master-token-refresh
      
      - name: Run podcast bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: python main.py
      
      - name: Upload podcast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast
          path: |
            output/*.mp3
            output/*.m4a
          retention-days: 7
          if-no-files-found: warn
