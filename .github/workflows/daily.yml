name: Daily Koohnameh Podcast

on:
  schedule:
    - cron: '0 18 * * *'  # Every day at 18:00 UTC (21:30 Iran)
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run podcast bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
          NOTEBOOKLM_CSRF: ${{ secrets.NOTEBOOKLM_CSRF }}
          NOTEBOOKLM_SESSION_ID: ${{ secrets.NOTEBOOKLM_SESSION_ID }}
        run: python main.py
      
      - name: Upload podcast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast
          path: |
            output/*.mp3
            output/*.txt
          retention-days: 7
          if-no-files-found: warn
