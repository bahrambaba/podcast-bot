name: Daily Koohnameh Podcast

on:
  schedule:
    - cron: '30 4 * * *'  # Every day at 04:30 UTC (08:00 Iran)
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh NotebookLM auth
        env:
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: |
          mkdir -p ~/.notebooklm/profiles/default
          printenv NOTEBOOKLM_MASTER_TOKEN > ~/.notebooklm/profiles/default/master_token.json
          python -m notebooklm login --master-token-refresh

      - name: Run podcast bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: python main.py

      - name: Upload podcast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast
          path: output/*.m4a
          retention-days: 7
