# Content filtering
filter:
  # Exclude keywords (Persian)
  exclude_keywords:
    - کلاس
    - دوره
    - آموزش
    - ثبت نام
    - تور
    - طبیعت گردی
    - کمپینگ
    - اردو
    - برنامه هفتگی
    - برنامه ماهانه
    - اطلاعیه
    - اعلامیه
    - لغو
    - تغییر برنامه
  
  # Minimum caption length for media
  min_caption_length: 20

# Podcast settings
podcast:
  language: fa
  style: conversational
  max_messages: 50
  intro_template: |
    سلام و درود خدمت شنوندگان عزیز.
    این پادکست خلاصه اخبار کوهنوردی دیروز {date} هست.
    از بین {total_messages} پیام در {channels_count} کانال فعال، توسط پایگاه خبری تحلیلی کوهنامه تهیه شده است.
  
  outro_template: |
    ممنون که وقت گذاشتید و گوش دادید.
    فردا همینجا منتظرتون هستیم.
    تا دیدار خدا نگهدارتون باشه.

# Output settings
output_dir: output
keep_days: 7
